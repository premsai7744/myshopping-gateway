spring.application.name=my-shopping-gateway


#ServerConfiguration
server.port=8888

#DebugConfiguration
#logging.level.org.springframework=DEBUG

#UserMicroservice
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates=Path=/user/**
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8001

#OrderMicroservice
spring.cloud.gateway.server.webmvc.routes[1].id=orders-service
spring.cloud.gateway.server.webmvc.routes[1].predicates=Path=/orders/**
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8005

#PaymentMicoservice
spring.cloud.gateway.server.webmvc.routes[2].id=payment-services
spring.cloud.gateway.server.webmvc.routes[2].predicates=Path=/payments/**
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8010

#EurkaServer url
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
